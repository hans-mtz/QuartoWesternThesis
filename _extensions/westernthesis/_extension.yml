title: Western Thesis
author: Hans Martinez
version: 0.1.0
quarto-required: ">=1.4.0"
contributes:
  shortcodes:
    - shortcodes.lua
  formats:
    pdf:
      filters:
        - westernthesis.lua
      documentclass: report
      classoption: [oneside, openany]
      papersize: letter
      fontsize: 12pt
      # SGPS §6.4: left >= 1.5in, top/bottom/right >= 1in. `includehead` keeps the
      # running header inside the 1in top margin.
      geometry:
        - left=1.5in
        - right=1in
        - top=1in
        - bottom=1in
        - includehead
        - headheight=15pt
        - footskip=0.4in
      number-sections: true
      # The TOC and lists are placed by the {{< western-lists >}} shortcode, after the
      # abstract, lay summary and acknowledgements (SGPS §1.4 order).
      toc-depth: 3
      template-partials:
        - partials/before-title.tex
        - partials/before-body.tex
        - partials/toc.tex
      # Thesis options (documented in _schema.yml)
      line-spacing: onehalf        # onehalf | double
      running-headers: true
      draft-title-page: false
